name: Deploy Static Game Arena to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run unit and game-engine invariant tests
        run: bun test --timeout 60000

      - name: Bundle browser application
        run: bun build apps/web/src/app.ts --outdir apps/web/public/dist --target browser --minify

      - name: Assemble static site for solo and local pass-and-play
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R apps/web/public/. _site/
          bun -e '
            import fs from "node:fs";
            const raw = fs.readFileSync("_site/index.html", "utf8");
            const html = raw.replace("<html lang=\"en\"", "<html lang=\"en\" data-static-only=\"true\"");
            if (html === raw) {
              throw new Error("Failed to inject data-static-only attribute into _site/index.html");
            }
            if (!fs.existsSync("_site/dist/app.js")) {
              throw new Error("Expected bundled _site/dist/app.js to exist");
            }
            fs.writeFileSync("_site/index.html", html);
            fs.writeFileSync("_site/404.html", html);
            fs.writeFileSync("_site/.nojekyll", "");
          '

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

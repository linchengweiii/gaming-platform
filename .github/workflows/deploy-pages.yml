name: Deploy Static Game Arena to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run unit and game-engine invariant tests
        run: bun test

      - name: Bundle browser application
        run: bun build apps/web/src/app.ts --outdir apps/web/public/dist --target browser --minify

      - name: Assemble static site for solo and local pass-and-play
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R apps/web/public/. _site/
          bun -e '
            import fs from "node:fs";
            const html = fs.readFileSync("_site/index.html", "utf8")
              .replace("<html lang=\"en\"", "<html lang=\"en\" data-static-only=\"true\"");
            fs.writeFileSync("_site/index.html", html);
            fs.writeFileSync("_site/404.html", html);
            fs.writeFileSync("_site/.nojekyll", "");
          '

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
